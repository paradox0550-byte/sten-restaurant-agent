name: Import canonical STEN package
on:
  push:
    paths:
      - ".github/unpack-trigger"
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Extract canonical package
        run: |
          set -euo pipefail
          test -f sten-restaurant-agent-complete-package.zip
          mkdir -p /tmp/sten-package
          unzip -q sten-restaurant-agent-complete-package.zip -d /tmp/sten-package
          test -f /tmp/sten-package/sten-restaurant-agent/package-manifest.json
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/ci.yml' --exclude='.github/workflows/import-package.yml' /tmp/sten-package/sten-restaurant-agent/ ./
          rm -f sten-restaurant-agent-complete-package.zip
          rm -f .github/unpack-trigger
      - name: Commit canonical structure
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: normalize complete STEN package structure"
          git push origin HEAD:main
