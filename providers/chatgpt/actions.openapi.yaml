openapi: 3.1.0
info:
  title: DUMRAUF API adapter template
  version: 0.1.0
  description: >
    Unconfigured template. Replace the server URL and define only endpoints
    implemented by a separately deployed authenticated DUMRAUF service.
servers:
  - url: https://YOUR_DEPLOYED_DUMRAUF_API_HOST
    description: Replace before use; this placeholder is not a live endpoint.
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
